name: aksat
description: "نظام إدارة الأPTSات والبيع بالتقسيط - تطبيق Flutter كلي."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.8.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.5
  flutter_screenutil: ^5.9.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  fl_chart: ^1.2.0
  url_launcher: ^6.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo-variable.ttf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0